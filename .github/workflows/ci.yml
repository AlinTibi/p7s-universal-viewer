name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore P7SUniversalViewer.slnx
      - run: dotnet build P7SUniversalViewer.slnx -c Release --no-restore
      - run: dotnet test P7SUniversalViewer.slnx -c Release --no-build --logger trx
      - name: Dependency audit
        shell: pwsh
        run: |
          dotnet list P7SUniversalViewer.slnx package --vulnerable --include-transitive --format json > audit.json
          if ($LASTEXITCODE) { throw 'Dependency audit failed.' }
          $audit = Get-Content audit.json -Raw | ConvertFrom-Json
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                foreach ($issue in $package.vulnerabilities) {
                  if ($issue.severity -in @('High','Critical')) { throw "Vulnerable dependency: $($package.id)" }
                }
              }
            }
          }
